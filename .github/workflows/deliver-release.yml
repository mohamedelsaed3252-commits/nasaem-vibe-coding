name: Upload reviewed delivery files

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS Replit development origin hosting the reviewed delivery
        required: true
        type: string
      release_id:
        description: Numeric ID of the existing draft release
        required: true
        type: string
      release_tag:
        description: Existing draft release tag
        required: true
        default: v1.0.0
        type: string
      checksums:
        description: SHA-256 checksum lines for the four delivery basenames
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: delivery-${{ github.repository }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download, verify and attach reviewed files
        env:
          BASE_URL: ${{ inputs.base_url }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHECKSUMS: ${{ inputs.checksums }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_URL" =~ ^https://[a-zA-Z0-9.-]+\.replit\.dev$ ]]
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9._-]+$ ]]
          mkdir delivery
          cd delivery
          source_root="$BASE_URL/@fs/home/runner/workspace/generated-artifacts"
          curl --fail --silent --show-error --retry 2 --max-time 120 \
            "$source_root/delivery/pdf/Nasaem-Presentation-Mohamed-El_saed.pdf" \
            -o Nasaem-Presentation-Mohamed-El_saed.pdf
          curl --fail --silent --show-error --retry 2 --max-time 120 \
            "$source_root/delivery/pdf/Nasaem-Project-Idea-Mohamed-El_saed.pdf" \
            -o Nasaem-Project-Idea-Mohamed-El_saed.pdf
          curl --fail --silent --show-error --retry 2 --max-time 120 \
            "$source_root/delivery/powerpoint/Nasaem-Presentation-Mohamed-El_saed.pptx" \
            -o Nasaem-Presentation-Mohamed-El_saed.pptx
          curl --fail --silent --show-error --retry 2 --max-time 120 \
            "$source_root/Nasaem-Project-Mohamed-El_saed.zip" \
            -o Nasaem-Project-Mohamed-El_saed.zip
          printf '%s\n' "$CHECKSUMS" | sha256sum --check --strict -
          gh release upload "$RELEASE_TAG" ./*.pdf ./*.pptx ./*.zip --clobber
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --silent
